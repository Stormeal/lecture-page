name: Playwright Admin Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for the test run
        required: true
        type: choice
        options:
          - dev
          - tst
      suite_tag:
        description: Optional suite tag without the @ prefix
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  run-playwright:
    runs-on: ubuntu-latest
    env:
      CI: true
      TEST_ENV: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous Playwright and Allure outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./src/tests/allure-results ./src/tests/allure-report ./src/tests/test-results

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          SUITE_TAG="${{ inputs.suite_tag }}"
          if [ -n "$SUITE_TAG" ]; then
            echo "Running suite @$SUITE_TAG against $TEST_ENV"
            npx playwright test --grep "@$SUITE_TAG"
          else
            echo "Running full suite against $TEST_ENV"
            npx playwright test
          fi

      - name: Generate Allure report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./src/tests/allure-report
          npx allure generate ./src/tests/allure-results -o ./src/tests/allure-report

      - name: Build (Angular)
        if: always()
        run: npx ng build --configuration production --base-href "/lecture-page/"

      - name: Resolve Angular output folder
        if: always()
        id: out
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(node -p "const a=require('./angular.json'); a.defaultProject || Object.keys(a.projects)[0]")"

          if [ -f "dist/$PROJECT/browser/index.html" ]; then
            OUT_DIR="dist/$PROJECT/browser"
          elif [ -f "dist/$PROJECT/index.html" ]; then
            OUT_DIR="dist/$PROJECT"
          else
            echo "Could not find Angular build output for project '$PROJECT'."
            echo "Tried:"
            echo "  dist/$PROJECT/browser/index.html"
            echo "  dist/$PROJECT/index.html"
            echo ""
            echo "dist/ contents:"
            ls -la dist || true
            echo ""
            echo "dist/$PROJECT contents:"
            ls -la "dist/$PROJECT" || true
            exit 1
          fi

          echo "Resolved OUT_DIR=$OUT_DIR"
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Bundle Allure report into Pages output
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="${{ steps.out.outputs.out_dir }}"
          if [ -z "$OUT_DIR" ]; then
            echo "Resolved OUT_DIR is empty. Failing to avoid writing to /allure."
            exit 1
          fi

          REPORT_SRC="src/tests/allure-report"
          REPORT_DST="$OUT_DIR/allure"

          if [ -f "$REPORT_SRC/index.html" ]; then
            mkdir -p "$REPORT_DST"
            cp -R "$REPORT_SRC/." "$REPORT_DST/"
            echo "Allure report bundled at /allure/"
          else
            echo "Allure report missing at $REPORT_SRC (missing index.html)."
            exit 1
          fi

      - name: SPA fallback for GitHub Pages (404.html)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${{ steps.out.outputs.out_dir }}"
          cp "$OUT_DIR/index.html" "$OUT_DIR/404.html"

      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.out_dir }}

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail workflow if tests failed
        if: always() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          echo "Playwright tests failed. Allure report was still published."
          exit 1
