name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Angular)
        run: npx ng build --configuration production --base-href "/lecture-page/"

      - name: Resolve Angular output folder
        id: out
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(node -p "const a=require('./angular.json'); a.defaultProject || Object.keys(a.projects)[0]")"

          # Angular output defaults to dist/<project> (and often dist/<project>/browser)
          if [ -f "dist/$PROJECT/browser/index.html" ]; then
            OUT_DIR="dist/$PROJECT/browser"
          elif [ -f "dist/$PROJECT/index.html" ]; then
            OUT_DIR="dist/$PROJECT"
          else
            echo "Could not find Angular build output for project '$PROJECT'."
            echo "Tried:"
            echo "  dist/$PROJECT/browser/index.html"
            echo "  dist/$PROJECT/index.html"
            echo ""
            echo "dist/ contents:"
            ls -la dist || true
            echo ""
            echo "dist/$PROJECT contents:"
            ls -la "dist/$PROJECT" || true
            exit 1
          fi

          echo "Resolved OUT_DIR=$OUT_DIR"
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Restore Allure history artifact
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="${{ steps.out.outputs.out_dir }}"
          TMP_DIR="$(mktemp -d)"
          API_URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=allure-history&per_page=1"

          echo "Attempting to restore Allure history artifact"

          ARTIFACT_URL="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL" |
            node -e "let data=''; process.stdin.on('data', (chunk) => data += chunk); process.stdin.on('end', () => { const parsed = JSON.parse(data); const artifact = (parsed.artifacts || []).find((item) => !item.expired); process.stdout.write(artifact?.archive_download_url || ''); });"
          )"

          if [ -z "$ARTIFACT_URL" ]; then
            echo "No previous Allure history artifact found. Continuing."
            exit 0
          fi

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$TMP_DIR/allure-history.zip" \
            "$ARTIFACT_URL"

          unzip -q "$TMP_DIR/allure-history.zip" -d "$TMP_DIR/extracted"

          mkdir -p "$OUT_DIR/allure"
          cp -R "$TMP_DIR/extracted/." "$OUT_DIR/allure/"
          echo "Restored Allure history artifact into $OUT_DIR/allure"
      - name: SPA fallback for GitHub Pages (404.html)
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${{ steps.out.outputs.out_dir }}"
          cp "$OUT_DIR/index.html" "$OUT_DIR/404.html"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.out_dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
