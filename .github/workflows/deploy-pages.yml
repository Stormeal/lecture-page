name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Angular)
        run: npx ng build --configuration production --base-href "/lecture-page/"

      - name: Resolve Angular output folder
        id: out
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(node -p "const a=require('./angular.json'); a.defaultProject || Object.keys(a.projects)[0]")"

          # Angular output defaults to dist/<project> (and often dist/<project>/browser)
          if [ -f "dist/$PROJECT/browser/index.html" ]; then
            OUT_DIR="dist/$PROJECT/browser"
          elif [ -f "dist/$PROJECT/index.html" ]; then
            OUT_DIR="dist/$PROJECT"
          else
            echo "Could not find Angular build output for project '$PROJECT'."
            echo "Tried:"
            echo "  dist/$PROJECT/browser/index.html"
            echo "  dist/$PROJECT/index.html"
            echo ""
            echo "dist/ contents:"
            ls -la dist || true
            echo ""
            echo "dist/$PROJECT contents:"
            ls -la "dist/$PROJECT" || true
            exit 1
          fi

          echo "Resolved OUT_DIR=$OUT_DIR"
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Preserve current Allure report
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="${{ steps.out.outputs.out_dir }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          ALLURE_URL="https://${OWNER}.github.io/${REPO}/allure/"
          TMP_DIR="$(mktemp -d)"

          echo "Attempting to preserve existing Allure report from $ALLURE_URL"

          if wget \
            --recursive \
            --no-parent \
            --page-requisites \
            --no-host-directories \
            --cut-dirs=1 \
            --directory-prefix="$TMP_DIR" \
            --reject "index.html.tmp*" \
            "$ALLURE_URL"; then
            if [ -d "$TMP_DIR/allure" ]; then
              mkdir -p "$OUT_DIR/allure"
              cp -R "$TMP_DIR/allure/." "$OUT_DIR/allure/"
              echo "Preserved existing Allure report."
            elif [ -d "$TMP_DIR/${REPO}/allure" ]; then
              mkdir -p "$OUT_DIR/allure"
              cp -R "$TMP_DIR/${REPO}/allure/." "$OUT_DIR/allure/"
              echo "Preserved existing Allure report."
            else
              echo "Allure report download completed but no allure folder was found. Skipping preserve step."
            fi
          else
            echo "No existing Allure report found to preserve. Continuing."
          fi
      - name: SPA fallback for GitHub Pages (404.html)
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${{ steps.out.outputs.out_dir }}"
          cp "$OUT_DIR/index.html" "$OUT_DIR/404.html"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.out_dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
